<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面未找到 · 网络安全新闻中心</title>
<style>
:root{
  --bg:#0b1120; --card:#111827; --card-border:#1f2937;
  --text:#f3f4f6; --muted:#9ca3af; --accent:#3b82f6;
  --accent-soft:rgba(59,130,246,.15); --gold:#fbbf24;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;
  padding:14px 24px;background:rgba(11,17,32,.85);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--card-border)}
.topbar .brand{font-weight:800;letter-spacing:.5px}
.topbar .brand .shield{color:var(--accent)}
.topbar .spacer{flex:1}
.topbar .home{font-size:14px;color:var(--muted)}
.wrap{max-width:900px;margin:0 auto;padding:32px 24px 64px}
.card{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:28px 32px;margin-top:24px}
h1{font-size:28px;margin:0 0 4px}
h2{font-size:20px;margin:32px 0 12px;color:#e5e7eb}
h3{font-size:17px;margin:24px 0 8px;color:#e5e7eb}
blockquote{margin:14px 0;padding:10px 16px;border-left:3px solid var(--accent);
  background:var(--accent-soft);color:var(--muted);border-radius:0 8px 8px 0;font-size:14px}
table{width:100%;border-collapse:collapse;margin:14px 0;font-size:14px}
th,td{border:1px solid var(--card-border);padding:8px 12px;text-align:left;vertical-align:top}
th{background:#0f172a;color:#cbd5e1;font-weight:700}
tr:nth-child(even) td{background:rgba(255,255,255,.02)}
hr{border:none;border-top:1px solid var(--card-border);margin:28px 0}
.meta{color:var(--muted);font-size:14px;margin-bottom:8px}
ul,ol{padding-left:22px}
code{background:#0f172a;padding:2px 6px;border-radius:6px;font-size:13px}
footer{color:var(--muted);font-size:13px;text-align:center;padding:24px}
.daynav{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;
  padding:14px 24px;background:rgba(17,24,39,.6);border-top:1px solid var(--card-border);font-size:14px}
.daynav a{color:#cbd5e1;text-decoration:none;padding:7px 14px;border-radius:10px;
  border:1px solid var(--card-border);transition:all .15s}
.daynav a:hover{border-color:var(--accent);color:#fff}
.daynav .dn-home{color:#9ca3af}
.daynav .dn-disabled{opacity:.35;pointer-events:none;border-style:dashed}
.toc{background:var(--card);border:1px solid var(--card-border);border-radius:12px;
  padding:16px 20px;margin:0 0 24px}
.toc h4{margin:0 0 10px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.5px}
.toc ol{margin:0;padding-left:20px}
.toc li{margin:5px 0}
.toc a{color:#cbd5e1}
.toc a:hover{color:#fff}
.skip{position:absolute;left:-9999px;top:0;background:var(--accent);color:#fff;
  padding:9px 16px;border-radius:0 0 10px 0;z-index:100;font-size:14px}
.skip:focus{left:12px;top:12px;text-decoration:none}
a:focus-visible,input:focus-visible,button:focus-visible,
.row-main:focus-visible,.rcard:focus-visible,.totop:focus-visible{
  outline:2px solid var(--gold);outline-offset:2px}
.totop{position:fixed;right:18px;bottom:18px;background:var(--accent);color:#fff;padding:9px 15px;
  border-radius:999px;font-size:13px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.45);z-index:20}
.totop:hover{text-decoration:none;opacity:.9}
/* ---- Mobile responsive (< 640px) ---- */
@media(max-width:640px){
  body{font-size:15px}
  .wrap{padding:10px 12px}
  .topbar{flex-wrap:wrap;gap:8px;padding:8px 12px}
  .topbar .brand{font-size:15px;flex-basis:100%}
  .topbar .search{flex:1 1 100%!important;min-width:0!important;order:3}
  .topbar .home{font-size:12px;order:2}
  .topbar .rss{order:4;font-size:12px}
  .row{padding:10px 12px;gap:8px}
  .row .date{min-width:0;font-size:13px;flex-shrink:0}
  .row .desc{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row-main{gap:6px}
  .tag-week{font-size:11px;padding:1px 5px;flex-shrink:0}
  .score{font-size:11px;padding:1px 6px;flex-shrink:0}
  h1{font-size:22px}
  .section-title h2{font-size:18px}
  .section-title .count{font-size:12px}
  .hero{padding:16px 14px}
  .hero h2{font-size:18px}
  .results .rcard{padding:10px 12px}
  .results .rcard .rtitle{font-size:15px}
  .totop{right:12px;bottom:12px;padding:7px 12px;font-size:12px}
  .grid{grid-template-columns:1fr!important}
}

.skip{position:absolute;left:-9999px;top:0;background:var(--accent);color:#fff;padding:9px 16px;border-radius:0 0 10px 0;z-index:100}
.skip:focus{left:12px;top:12px;text-decoration:none}
a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>

</div>
<main id="main" class="wrap">

    <h1 style="font-size:64px;margin:8px 0">404</h1>
    <p class="meta">抱歉，你访问的页面不存在或已被移动。</p>
    <p style="margin-top:18px">
      <a class="hero-link" style="display:inline-block;font-weight:700;color:#fff;background:var(--accent);padding:10px 20px;border-radius:10px" href="index.html">← 返回首页查看最新安全新闻</a>
    </p>
    <p class="meta" style="margin-top:18px">也可试试顶部的搜索框，按日期 / 标题 / CVE 编号查找。</p>
  </article>
  <footer>本站点由 WorkBuddy 自动化任务生成并发布至 GitHub Pages · 仅供安全研究参考</footer>

</body>
</html>
